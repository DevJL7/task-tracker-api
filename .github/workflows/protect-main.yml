name: Protect Main Branch

# GitHub Actions GITHUB_TOKEN cannot change branch protection.
# Add secret REPO_SETUP_TOKEN (PAT with Administration: Read and write on this repo)
# then run this workflow manually once.

on:
  workflow_dispatch:

jobs:
  protect-main:
    runs-on: ubuntu-latest
    steps:
      - name: Protect main branch
        uses: actions/github-script@v7
        env:
          SETUP_TOKEN: ${{ secrets.REPO_SETUP_TOKEN }}
        with:
          github-token: ${{ secrets.REPO_SETUP_TOKEN }}
          script: |
            if (!process.env.SETUP_TOKEN) {
              core.setFailed(
                'Missing secret REPO_SETUP_TOKEN. Create a fine-grained PAT with ' +
                'Administration: Read and write on this repo, add it as repo secret, re-run.'
              );
              return;
            }

            const { owner, repo } = context.repo;

            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch: 'main',
              required_status_checks: {
                strict: true,
                contexts: ['test', 'CI / test']
              },
              enforce_admins: false,
              required_pull_request_reviews: {
                required_approving_review_count: 0,
                dismiss_stale_reviews: false
              },
              restrictions: null,
              allow_force_pushes: false,
              allow_deletions: false
            });

            core.info('Branch protection enabled on main');
