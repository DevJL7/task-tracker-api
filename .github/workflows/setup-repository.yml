name: Setup Repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  administration: write

jobs:
  create-develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create develop branch if missing
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
            echo "Branch develop already exists"
          else
            git checkout -b develop
            git push origin develop
            echo "Created branch develop"
          fi

  protect-main:
    needs: create-develop
    runs-on: ubuntu-latest
    steps:
      - name: Protect main branch
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.updateBranchProtection({
                owner,
                repo,
                branch: 'main',
                required_status_checks: {
                  strict: true,
                  contexts: ['test', 'CI / test']
                },
                enforce_admins: false,
                required_pull_request_reviews: {
                  required_approving_review_count: 0,
                  dismiss_stale_reviews: false
                },
                restrictions: null,
                allow_force_pushes: false,
                allow_deletions: false
              });
              core.info('Branch protection enabled on main');
            } catch (error) {
              core.setFailed(
                'Enable Settings → Actions → General → Workflow permissions → ' +
                'Read and write permissions, then re-run Setup Repository.'
              );
              throw error;
            }
